<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="350" fill="#1F2421" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="310" rx="6" fill="none" stroke="#E2E4DE" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Graph / Binary Tree Graphic Elements -->
  <!-- Edges -->
  <line x1="300" y1="75" x2="230" y2="125" stroke="#5C6460" stroke-width="2" />
  <line x1="300" y1="75" x2="370" y2="125" stroke="#A51C30" stroke-width="2.5" />
  <line x1="230" y1="125" x2="190" y2="175" stroke="#5C6460" stroke-width="2" />
  <line x1="230" y1="125" x2="270" y2="175" stroke="#5C6460" stroke-width="2" />
  <line x1="370" y1="125" x2="330" y2="175" stroke="#A51C30" stroke-width="2.5" />
  <line x1="370" y1="125" x2="410" y2="175" stroke="#5C6460" stroke-width="2" />

  <!-- Nodes -->
  <!-- Root -->
  <circle cx="300" cy="75" r="14" fill="#A51C30" />
  <text x="300" y="80" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">O(1)</text>

  <!-- Level 1 -->
  <circle cx="230" cy="125" r="12" fill="#2C332F" stroke="#E2E4DE" stroke-width="1.5" />
  <circle cx="370" cy="125" r="12" fill="#A51C30" />

  <!-- Level 2 -->
  <circle cx="190" cy="175" r="10" fill="#2C332F" stroke="#5C6460" stroke-width="1.5" />
  <circle cx="270" cy="175" r="10" fill="#2C332F" stroke="#5C6460" stroke-width="1.5" />
  <circle cx="330" cy="175" r="10" fill="#A51C30" stroke="#FBFBF8" stroke-width="1" />
  <circle cx="410" cy="175" r="10" fill="#2C332F" stroke="#5C6460" stroke-width="1.5" />

  <!-- Typography -->
  <text x="300" y="235" font-family="'Merriweather', Georgia, serif" font-size="22" font-weight="bold" fill="#FBFBF8" text-anchor="middle">Course 6.006</text>
  <text x="300" y="265" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#A51C30" text-anchor="middle" letter-spacing="3">INTRODUCTION TO ALGORITHMS</text>
  <text x="300" y="290" font-family="'Inter', sans-serif" font-size="11" fill="#5C6460" text-anchor="middle" letter-spacing="1.5">TREES • HASHING • DIJKSTRA • DYNAMIC PROGRAMMING</text>
