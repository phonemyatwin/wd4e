  <rect x="340" y="145" width="22" height="35" fill="#2C332F" stroke="#5C6460" stroke-width="1" />

  <!-- Smooth Trend Line -->
  <path d="M 215 155 Q 260 120 291 60 T 365 150" fill="none" stroke="#FBFBF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Typography -->
  <text x="300" y="235" font-family="'Merriweather', Georgia, serif" font-size="22" font-weight="bold" fill="#FBFBF8" text-anchor="middle">Harvard PH125.1x</text>
  <text x="300" y="265" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#A51C30" text-anchor="middle" letter-spacing="3">DATA SCIENCE: R BASICS</text>
  <text x="300" y="290" font-family="'Inter', sans-serif" font-size="11" fill="#5C6460" text-anchor="middle" letter-spacing="1.5">TIDYVERSE • GGPLOT2 • DATA WRANGLING</text>
