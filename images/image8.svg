  <!-- Data Visualization Graphic Elements -->
  <!-- Chart Axes -->
  <line x1="200" y1="180" x2="400" y2="180" stroke="#5C6460" stroke-width="1.5" />
  <line x1="200" y1="180" x2="200" y2="60" stroke="#5C6460" stroke-width="1.5" />

  <!-- Grid lines -->
  <line x1="200" y1="140" x2="400" y2="140" stroke="#2C332F" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="200" y1="100" x2="400" y2="100" stroke="#2C332F" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Histogram / Bar elements -->
  <rect x="220" y="130" width="22" height="50" fill="#2C332F" stroke="#5C6460" stroke-width="1" />
  <rect x="250" y="90" width="22" height="90" fill="#E7C2C7" />
