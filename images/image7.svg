<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="350" fill="#1F2421" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="310" rx="6" fill="none" stroke="#E2E4DE" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Orbital / Pendulum Graphic Elements -->
  <!-- Central Body / Pivot -->
  <circle cx="300" cy="115" r="8" fill="#FBFBF8" />
  
  <!-- Elliptical Orbits -->
  <ellipse cx="300" cy="115" rx="100" ry="40" fill="none" stroke="#5C6460" stroke-width="1.5" stroke-dasharray="4,4" transform="rotate(-15 300 115)" />
  <ellipse cx="300" cy="115" rx="130" ry="55" fill="none" stroke="#2C332F" stroke-width="1.5" transform="rotate(25 300 115)" />

  <!-- Moving Mass / Planet -->
  <circle cx="385" cy="90" r="9" fill="#A51C30" />
  
  <!-- Velocity & Force Vectors -->
  <line x1="385" y1="90" x2="425" y2="60" stroke="#E7C2C7" stroke-width="2" />
  <polygon points="425,60 415,64 421,72" fill="#E7C2C7" />
  
  <line x1="385" y1="90" x2="330" y2="105" stroke="#A51C30" stroke-width="2" />
  <polygon points="330,105 342,102 339,110" fill="#A51C30" />

  <!-- Typography -->
  <text x="300" y="235" font-family="'Merriweather', Georgia, serif" font-size="22" font-weight="bold" fill="#FBFBF8" text-anchor="middle">Course 8.01SC</text>
  <text x="300" y="265" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#A51C30" text-anchor="middle" letter-spacing="3">CLASSICAL MECHANICS</text>
  <text x="300" y="290" font-family="'Inter', sans-serif" font-size="11" fill="#5C6460" text-anchor="middle" letter-spacing="1.5">NEWTON'S LAWS • MOMENTUM • HARMONIC MOTION</text>
</svg>
