<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="350" fill="#1F2421" />

  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2C332F" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="350" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="20" y="20" width="560" height="310" rx="6" fill="none" stroke="#E2E4DE" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Vector & Matrix Graphic Elements -->
  <!-- Coordinate Axis -->
  <line x1="220" y1="170" x2="380" y2="170" stroke="#5C6460" stroke-width="1.5" />
  <line x1="300" y1="90" x2="300" y2="210" stroke="#5C6460" stroke-width="1.5" />

  <!-- Vectors -->
  <line x1="300" y1="170" x2="360" y2="110" stroke="#A51C30" stroke-width="3" />
  <polygon points="360,110 350,113 357,120" fill="#A51C30" />

  <line x1="300" y1="170" x2="245" y2="125" stroke="#E7C2C7" stroke-width="2.5" />
  <polygon points="245,125 255,128 250,136" fill="#E7C2C7" />

  <!-- Matrix Notation Bracket Graphic -->
  <text x="300" y="245" font-family="'Merriweather', Georgia, serif" font-size="22" font-weight="bold" fill="#FBFBF8" text-anchor="middle">Course 18.06</text>
  <text x="300" y="275" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#A51C30" text-anchor="middle" letter-spacing="3">LINEAR ALGEBRA</text>
  <text x="300" y="300" font-family="'Inter', sans-serif" font-size="11" fill="#5C6460" text-anchor="middle" letter-spacing="1">Ax = λx • SVD • VECTOR SPACES</text>
</svg>
