<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="350" fill="#1F2421" />

  <!-- Frame -->
  <rect x="20" y="20" width="560" height="310" rx="6" fill="none" stroke="#E2E4DE" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Scales of Justice Icon -->
  <g transform="translate(300, 115)" stroke="#A51C30" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Center Pillar -->
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#FBFBF8" stroke-width="3.5" />
    <path d="M -18 45 L 18 45" stroke="#FBFBF8" stroke-width="4" />
    <circle cx="0" cy="-45" r="4" fill="#A51C30" stroke="none" />

    <!-- Crossbeam -->
    <line x1="-55" y1="-30" x2="55" y2="-30" stroke="#FBFBF8" stroke-width="3" />

    <!-- Left Scale Pan -->
    <line x1="-55" y1="-30" x2="-75" y2="10" stroke-width="1.5" stroke="#E2E4DE" />
    <line x1="-55" y1="-30" x2="-35" y2="10" stroke-width="1.5" stroke="#E2E4DE" />
    <path d="M -80 10 Q -55 25 -30 10 Z" fill="#A51C30" />

    <!-- Right Scale Pan -->
    <line x1="55" y1="-30" x2="35" y2="10" stroke-width="1.5" stroke="#E2E4DE" />
    <line x1="55" y1="-30" x2="75" y2="10" stroke-width="1.5" stroke="#E2E4DE" />
    <path d="M 30 10 Q 55 25 80 10 Z" fill="#A51C30" />
  </g>

  <!-- Typography -->
  <text x="300" y="225" font-family="'Merriweather', Georgia, serif" font-size="24" font-weight="bold" fill="#FBFBF8" text-anchor="middle">Harvard ER 22</text>
  <text x="300" y="255" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#A51C30" text-anchor="middle" letter-spacing="3">JUSTICE &amp; MORAL REASONING</text>
  <text x="300" y="280" font-family="'Inter', sans-serif" font-size="11" fill="#5C6460" text-anchor="middle" letter-spacing="1.5">KANT • RAWLS • UTILITARIANISM</text>
</svg>
